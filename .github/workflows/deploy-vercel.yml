name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings
        run: npx vercel@59.0.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: npx vercel@59.0.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: npx vercel@59.0.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
